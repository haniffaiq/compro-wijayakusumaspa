server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Jangan biarkan nginx membalas 301 ke versi bertrailing slash: crawler
  # pratinjau tautan WhatsApp sebaiknya dapat HTML di percobaan pertama.
  absolute_redirect off;

  # Route sekunder punya HTML hasil prerender di <route>/index.html, dan
  # $uri/index.html menyajikannya langsung tanpa redirect. /index.html di
  # ujung hanya fallback SPA, padanan redirect 200 di netlify.toml
  # (AGENTS.md §18.4).
  location / {
    try_files $uri $uri/index.html $uri/ /index.html;
  }

  # Nama file aset sudah berisi hash, jadi aman di-cache permanen.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # HTML tidak berhash: jangan di-cache, supaya deploy baru langsung terbaca.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
